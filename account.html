<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile &middot; Peninsula Montessori Lessons</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/site.js"></script>
</head>
<body>
  <header class="site-header">
    <div>
      <h1>Profile</h1>
      <p class="page-intro">Your account &amp; saved lessons</p>
    </div>
  </header>

  <main class="page account-page">
    <section class="account-card">
      <img class="account-photo" id="account-photo" src="" alt="">
      <div class="account-fields">
        <p class="account-name" id="account-name"></p>
        <p class="account-email" id="account-email"></p>
        <p class="badge" id="account-role"></p>
      </div>
    </section>

    <a class="btn btn-secondary" id="switch-account-link" href="login.html">Switch Account</a>

    <div class="section-title">
      <h2>Favorites</h2>
    </div>
    <section class="lesson-grid" id="favorites-grid" aria-label="Favorite lesson plans">
      <p class="page-intro" id="favorites-empty" hidden>No saved lessons yet. Tap the heart on any lesson in Discover to save it here.</p>
    </section>

    <div class="section-title">
      <h2>Usage History</h2>
    </div>
    <ul class="history-list" id="history-list"></ul>
    <p class="page-intro" id="history-empty" hidden>No completed lessons yet.</p>
  </main>

  <nav class="bottom-nav" aria-label="Primary">
    <a class="nav-item" href="index.html"><span class="nav-icon">🏠</span>Explore</a>
    <a class="nav-item" href="my-week.html"><span class="nav-icon">▣</span>My Week</a>
    <a class="nav-item is-active" href="account.html"><span class="nav-icon">♙</span>Profile</a>
  </nav>

  <script>
    var user = PML.getUser();
    document.getElementById('account-photo').src = 'https://picsum.photos/seed/' + user.photoSeed + '/160/160';
    document.getElementById('account-photo').alt = user.name + "'s profile photo";
    document.getElementById('account-name').textContent = user.name;
    document.getElementById('account-email').textContent = user.email;
    document.getElementById('account-role').textContent = user.role;

    var favoritesGrid = document.getElementById('favorites-grid');
    var favoritesEmpty = document.getElementById('favorites-empty');
    var favorites = PML.getFavorites();
    favorites.forEach(function (lessonId) {
      favoritesEmpty.insertAdjacentHTML('beforebegin', PML.lessonCardMarkup(lessonId));
    });
    favoritesEmpty.hidden = favorites.length !== 0;
    PML.initSaveButtons(favoritesGrid, function (lessonId, saved) {
      if (!saved) {
        var card = favoritesGrid.querySelector('.lesson-card[data-lesson="' + lessonId + '"]');
        if (card) card.remove();
        favoritesEmpty.hidden = favoritesGrid.querySelectorAll('.lesson-card').length !== 0;
      }
    });

    var historyList = document.getElementById('history-list');
    var historyEmpty = document.getElementById('history-empty');
    var completed = PML.getCompleted();
    historyList.innerHTML = completed.map(PML.historyItemMarkup).join('');
    historyEmpty.hidden = completed.length !== 0;
  </script>
</body>
</html>
